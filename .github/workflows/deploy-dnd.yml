# Builds the D&D character sheet (in dnd-sheet/) and publishes it to GitHub
# Pages. Enable once under: Settings → Pages → Source → "GitHub Actions".
# Once this is on the default branch (main) with Pages enabled, the site is
# live at https://<user>.github.io/<repo>/ and redeploys on every push.
name: Deploy D&D Sheet to Pages

on:
  push:
    branches: ["main"]
    paths: ["dnd-sheet/**", ".github/workflows/deploy-dnd.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dnd-sheet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dnd-sheet/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dnd-sheet/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
